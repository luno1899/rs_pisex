name: Build

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

env:
  # Metamod:Source 2.0.0-dev+1411 (plugin API 17:14, no KHook) - do not move to API 18.
  METAMOD_COMMIT: 7ec0f16948ab3a0910a98b4ac10e1c0e360d5339
  # Last alliedmodders/hl2sdk cs2 commit before 2025-10-18.
  HL2SDK_COMMIT: 84a823db042b49d2f6934b770dafbf3a366cef26
  AMBUILD_COMMIT: d89ec91a7ac2607da07b50bb62346f9a10e9a998
  # Valve Steam Runtime 3 "sniper" SDK: the toolchain the CS2 dedicated server is built against.
  STEAMRT_IMAGE: registry.gitlab.steamos.cloud/steamrt/sniper/sdk@sha256:2969e5a47146a6494c01d953cd818b1d62712f42f9e54c4809d7a3aa8dc276ce

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: plugin

      - name: Fetch Metamod:Source, HL2SDK and AMBuild (pinned)
        run: |
          git clone --filter=blob:none https://github.com/alliedmodders/metamod-source.git metamod-source
          git -C metamod-source checkout --detach "$METAMOD_COMMIT"
          git -C metamod-source submodule update --init --recursive
          git clone --filter=blob:none https://github.com/alliedmodders/hl2sdk.git hl2sdk-cs2
          git -C hl2sdk-cs2 checkout --detach "$HL2SDK_COMMIT"
          git clone --filter=blob:none https://github.com/alliedmodders/ambuild.git ambuild
          git -C ambuild checkout --detach "$AMBUILD_COMMIT"

      - name: Build Linux (Steam Runtime 3, x64)
        run: |
          set -o pipefail
          cat > build-in-container.sh <<'INNER'
          set -eu
          export PYTHONPATH=/w/ambuild CC=clang CXX=clang++
          cd /w/plugin
          rm -rf build && mkdir build && cd build
          python3 ../configure.py --enable-optimize --plugin-name=resetscore --plugin-alias=resetscore \
            --sdks cs2 --targets x86_64 \
            --mms_path /w/metamod-source \
            --hl2sdk-root /w \
            --hl2sdk-manifests /w/metamod-source/hl2sdk-manifests
          python3 -c 'from ambuild2.run import cli_run; cli_run()'
          INNER
          if ! docker run --rm -v "$GITHUB_WORKSPACE:/w" "$STEAMRT_IMAGE" bash -lc "$(sed 's/^          //' build-in-container.sh)" 2>&1 | tee build.log; then
            # Surface compiler/linker errors as one annotation so they are readable without the raw log.
            msg=$( { grep -E 'error|undefined|Build failed|Traceback|Error' build.log | grep -v ' -pipe ' | head -40; echo '--- tail ---'; tail -15 build.log | cut -c1-300; } | sed 's/%/%25/g' | paste -sd '|' - | sed 's/|/%0A/g' || true)
            echo "::error title=Linux build errors::${msg}"
            exit 1
          fi

      - name: Stage package
        run: |
          # the container built as root
          sudo chown -R "$(id -u):$(id -g)" plugin/build
          mkdir -p plugin/build/package/addons/translations
          cp plugin/translations/resetscore.phrases.txt plugin/build/package/addons/translations/
          find plugin/build/package -type f

      - uses: actions/upload-artifact@v4
        with:
          name: resetscore-linux-x64
          path: plugin/build/package
          if-no-files-found: error
